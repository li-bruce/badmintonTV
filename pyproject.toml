[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "badmintontv-platform"
version = "0.1.0"
description = "Local badminton video annotation and retrieval workbench"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3"]

[project.optional-dependencies]
workbench = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "jinja2>=3.1,<4", "httpx>=0.27,<1", "python-multipart>=0.0.18"]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["apps*", "packages*"]

[tool.setuptools.package-data]
"apps.platform" = ["templates/*.html", "static/*"]
"packages.contracts" = ["schemas/*.json", "fixtures/*.json", "fixtures/*.jsonl", "fixtures/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests/platform", "tests/contracts"]
pythonpath = ["."]
